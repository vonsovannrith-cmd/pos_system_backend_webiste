services:
  backend:
    build: .
    container_name: pos_system
    ports:
      - "8080:8080"
    environment:
      PORT: 8080

      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      CORS_ORIGINS: "http://localhost:3000,https://pos-system-website-149evos1q-vonsovannrith-8230s-projects.vercel.app"
    restart: always