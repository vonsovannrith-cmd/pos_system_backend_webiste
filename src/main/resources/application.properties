
# ==========================================
# Server Configuration
# ==========================================
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework

# ==========================================
# Spring Application
# ==========================================
spring.application.name=pos

# ==========================================
# PostgreSQL Database
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pos_system}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:RITH2008@khmer}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA & Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# Flyway Migration
# ==========================================
spring.flyway.enabled=true

# ==========================================
# Pagination
# ==========================================
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# ==========================================
# JWT Configuration
# ==========================================
app.jwt.secret=${JWT_SECRET:jEluwlKE9ZtiqbtIDayL88U81ySrSPTt+Mcx80ap1mI=}
app.jwt.expiration-ms=43200000

# ==========================================
# CORS Configuration
# ==========================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ==========================================
# Admin Configuration
# ==========================================
app.admin.full-name=System Admin
app.admin.email=${ADMIN_EMAIL:admin@pos.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# ==========================================
# POS Configuration
# ==========================================
app.pos.cashier-max-discount-percent=10

# ==========================================
# Authentication Cookie
# ==========================================
app.auth.cookie-secure=${COOKIE_SECURE:false}
app.auth.expose-token=${EXPOSE_TOKEN:false}

# ==========================================
# Tomcat Configuration
# ==========================================
server.tomcat.max-swallow-size=20MB

# ==========================================
# Multipart Configuration
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ==========================================
# Image Configuration
# ==========================================
app.image.max-pixels=16000000

# ==========================================
# Redis Configuration (Local)
# ==========================================
app.redis.enabled=${REDIS_ENABLED:false}
app.redis.revocation-cache-seconds=60
