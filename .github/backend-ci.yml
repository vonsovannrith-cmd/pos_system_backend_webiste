
name: POS Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pos_demo
          POSTGRES_USER: pos_user
          POSTGRES_PASSWORD: pos_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos_user -d pos_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/pos_demo
      DB_USERNAME: pos_user
      DB_PASSWORD: pos_password
      REDIS_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U pos_user -d pos_demo; do
            sleep 2
          done
        env:
          PGPASSWORD: pos_password

      - name: Run Tests
        run: mvn -B -ntp clean verify
