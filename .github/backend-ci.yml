
name: POS Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pos_test_db
          POSTGRES_USER: pos_test_user
          POSTGRES_PASSWORD: pos_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos_test_user -d pos_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/pos_test_db
      DB_USERNAME: pos_test_user
      DB_PASSWORD: pos_test_password
      REDIS_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check PostgreSQL
        run: |
          pg_isready -h localhost -p 5432 -U pos_test_user

      - name: Run Backend Tests
        run: mvn -B -ntp clean verify
